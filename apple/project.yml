# XcodeGen spec. From apple/: `xcodegen generate` creates MacSubsystemForAndroid.xcodeproj.
#
# Two targets:
#   Subsystem       the app (menu bar + settings, runs Android in QEMU)
#   AndroidAppHost  the window host copied into every Android app launcher
#
# The build copies whatever is in ../build/payload into the app:
#   qemu/        QEMU and its libraries (core/scripts/bundle-qemu.sh)
#   bridge.apk   the bridge app (android/bridge/build.sh)
#   scrcpy-server.jar  (core/scripts/fetch-scrcpy-server.sh)
# For development without them, `brew install qemu` is enough for QEMU.
name: MacSubsystemForAndroid
options:
  bundleIdPrefix: io.github.harkhowalia1
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.3.4"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  # ---------------------------------------------------------------- Window host
  AndroidAppHost:
    type: tool
    platform: macOS
    sources:
      - path: AppHost
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: AndroidAppHost
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).apphost
        SKIP_INSTALL: YES
        # Launchers re-sign their copy ad hoc on the person's Mac.
        ENABLE_HARDENED_RUNTIME: YES

  # ---------------------------------------------------------------- Subsystem app
  Subsystem:
    type: application
    platform: macOS
    sources:
      - path: Subsystem
      - path: Shared
      - path: Resources/Assets.xcassets
      - path: Resources/zh-Hans.lproj
        type: folder
        buildPhase: resources
      # Liquid Glass icon (Icon Composer); actool also derives the older macOS icon from it.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: AndroidAppHost
        embed: false
        link: false
    info:
      path: Subsystem/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleName: $(APP_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # A background app with a menu bar item; the settings window brings it to the Dock.
        LSUIElement: true
        NSHumanReadableCopyright: Free software under the GNU GPL v3.
        NSMicrophoneUsageDescription: Android apps you allow can use the microphone (turn it on in Settings › System).
        MSADisplayName: $(APP_NAME)
        MSAShortName: $(APP_SHORT_NAME)
        MSALegacySupportFolders: $(LEGACY_SUPPORT_FOLDERS)
        MSASubsystemBundleID: $(PRODUCT_BUNDLE_IDENTIFIER)
        MSAURLScheme: $(URL_SCHEME)
        MSASupportFolder: $(APP_NAME)
        MSALauncherFolder: $(LAUNCHER_FOLDER)
        MSAADBPort: $(ADB_PORT)
        MSAScrcpyVersion: $(SCRCPY_VERSION)
        MSABridgeVersion: $(MSA_BRIDGE_VERSION)
        MSABridgePackage: $(MSA_BRIDGE_PACKAGE)
        MSARepository: $(REPOSITORY)
        MSAWebsiteURL: $(WEBSITE_URL)
        MSAImageRepositories: $(IMAGE_REPOSITORIES)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(URL_SCHEME)]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android app
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [apk]
              public.mime-type: [application/vnd.android.package-archive]
          - UTTypeIdentifier: io.github.msa.apks
            UTTypeDescription: Android app bundle
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [apks, apkm, xapk]
          - UTTypeIdentifier: io.github.msa.utm
            UTTypeDescription: Virtual machine
            UTTypeConformsTo: [com.apple.package, public.directory]
            UTTypeTagSpecification:
              public.filename-extension: [utm]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Android app
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.android.package-archive, io.github.msa.apks]
          - CFBundleTypeName: Android image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.github.msa.utm]
    entitlements:
      path: Subsystem/Subsystem.entitlements
      properties:
        # QEMU's libraries are signed separately from the app.
        com.apple.security.cs.disable-library-validation: true
    postBuildScripts:
      - name: Embed window host, QEMU and Android payload
        basedOnDependencyAnalysis: false
        script: |
          set -e
          CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${CONTENTS}/Helpers" "${CONTENTS}/Resources"
          cp -f "${BUILT_PRODUCTS_DIR}/AndroidAppHost" "${CONTENTS}/Helpers/AndroidAppHost"
          PAYLOAD="${SRCROOT}/../build/payload"
          if [ -d "${PAYLOAD}/qemu" ]; then
            rsync -a "${PAYLOAD}/qemu/Helpers/" "${CONTENTS}/Helpers/"
            mkdir -p "${CONTENTS}/Frameworks" "${CONTENTS}/Resources/qemu"
            rsync -a "${PAYLOAD}/qemu/Frameworks/" "${CONTENTS}/Frameworks/"
            rsync -a "${PAYLOAD}/qemu/share/" "${CONTENTS}/Resources/qemu/"
            # Nested code must be signed before Xcode signs the app (CI signs in package-mac.sh instead).
            if [ "${CODE_SIGNING_ALLOWED}" != "NO" ]; then
              IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
              find "${CONTENTS}/Frameworks/qemu" -type f -exec codesign --force --sign "${IDENTITY}" {} \;
              codesign --force --sign "${IDENTITY}" --options runtime \
                --entitlements "${SRCROOT}/Subsystem/QEMU.entitlements" \
                "${CONTENTS}/Helpers/qemu-system-aarch64" "${CONTENTS}/Helpers/qemu-img"
            fi
          else
            echo "warning: build/payload/qemu is missing; the app will use Homebrew's QEMU (brew install qemu)"
          fi
          for file in bridge.apk scrcpy-server.jar; do
            if [ -f "${PAYLOAD}/${file}" ]; then
              cp -f "${PAYLOAD}/${file}" "${CONTENTS}/Resources/${file}"
            else
              echo "warning: build/payload/${file} is missing; see README › Building"
            fi
          done
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
